name: Publish V8 Kinetic Atelier

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get latest V8 portfolio files
        uses: actions/checkout@v4
        with:
          repository: thaseenportfolio/thaseen-portfolio
          ref: main
          path: portfolio

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare site
        run: |
          mkdir -p _site
          cp -a portfolio/index.html portfolio/styles.css portfolio/script.js portfolio/favicon.svg portfolio/motion-v7.css portfolio/motion-v7.js portfolio/motion-v8.css portfolio/motion-v8.js portfolio/assets portfolio/robots.txt portfolio/sitemap.xml _site/
          touch _site/.nojekyll
          test -f _site/index.html
          test -f _site/robots.txt
          test -f _site/sitemap.xml
          test -f _site/assets/thaseen-hero-portrait.png

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
